services:
  - type: web
    name: orderlypos-backend
    runtime: node
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: "https://orderlypos-ui.vercel.app"
      - key: COOKIE_SECURE
        value: "true"
      - key: PUBLIC_ASSET_BASE_URL
        value: "https://orderlypos-ui.vercel.app"
      - key: META_APP_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: "https://api.openai.com/v1"
